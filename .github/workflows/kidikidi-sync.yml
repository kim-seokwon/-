name: 키디키디 주문 수집

on:
  # 스케줄 복구(2026-11-19 사장님 승인): 08-18 중지 → 11-19 dry·실행 연속 성공 후 하루 2번(09·15시 KST).
  schedule:
    - cron: '0 0,6 * * *'
  workflow_dispatch:        # 수동 실행 버튼
    inputs:
      extend:
        description: '이랜드 계정 연장 요청 [확인] 누르기 (사장님 승인 후 1회)'
        type: boolean
        default: false
      dry:
        description: '미리보기만(저장 안 함) — 월별 주문 수·여러 줄 주문 수 로그'
        type: boolean
        default: false
      lookback_days:
        description: '조회 기간(일) — 비우면 400. 2025-07 까지 보려면 520 (11-19 H)'
        type: string
        default: ''

concurrency:
  group: kidikidi-order-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: channel-bots/kidikidi
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run sync
        env:
          ELAND_ID: ${{ secrets.ELAND_ID }}
          ELAND_PW: ${{ secrets.ELAND_PW }}
          ELAND_TOTP_SECRET: ${{ secrets.ELAND_TOTP_SECRET }}
          ELAND_EXTEND: ${{ inputs.extend && '1' || '' }}
          DRY: ${{ inputs.dry && '1' || '' }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
