name: 키디키디 주문 수집

on:
  # ⚠️ 스케줄 중지(2026-08-18): 키디키디(이랜드) 봇이 2026-03 이후 수집 중단 상태라 매시간 실패 알림만 옴.
  #   봇 복구(로그인/API) 후 schedule 복구할 것. 그때까지 수동 실행만.
  workflow_dispatch:
  workflow_dispatch:        # 수동 실행 버튼

concurrency:
  group: kidikidi-order-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: channel-bots/kidikidi
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run sync
        env:
          ELAND_ID: ${{ secrets.ELAND_ID }}
          ELAND_PW: ${{ secrets.ELAND_PW }}
          ELAND_TOTP_SECRET: ${{ secrets.ELAND_TOTP_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
