name: 29CM 주문 수집

on:
  # Gmail OTP 수신 계정 재연결 전까지 정기 실행을 중지한다.
  # 실패 알림만 반복되고 주문은 수집되지 않으므로, 연결 복구 후 schedule을 다시 켠다.
  workflow_dispatch:

concurrency:
  group: 29cm-order-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25   # 계정 2개를 차례로
    defaults:
      run:
        working-directory: channel-bots/29cm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run sync
        env:
          CM29_ID: ${{ secrets.CM29_ID }}
          CM29_PW: ${{ secrets.CM29_PW }}
          CM29_TOTP_SECRET: ${{ secrets.CM29_TOTP_SECRET }}
          CM29_OTP_TO: ${{ secrets.CM29_OTP_TO }}
          # 2계정: 로하이스튜디오(mall_key 29cm-rohi). 비어 있으면 건너뜀
          CM29_ID_2: ${{ secrets.CM29_ID_2 }}
          CM29_PW_2: ${{ secrets.CM29_PW_2 }}
          CM29_TOTP_SECRET_2: ${{ secrets.CM29_TOTP_SECRET_2 }}
          CM29_OTP_TO_2: ${{ secrets.CM29_OTP_TO_2 }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      # 2차인증 화면 캡처·HTML 앞부분(이메일·6자리 이상 숫자 가림) — 화면 구조 확인용, 3일 보관
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 29cm-2fa-debug
          path: channel-bots/29cm/debug/
          if-no-files-found: ignore
          retention-days: 3
