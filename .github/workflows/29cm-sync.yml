name: 29CM 주문 수집

on:
  # 10-22 Gmail 재연결·수집 확인(756건) → 정기 재개. 로그인마다 인증번호 메일 1통이라 하루 1번(06:00 KST)만
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

concurrency:
  group: 29cm-order-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25   # 계정 2개를 차례로
    defaults:
      run:
        working-directory: channel-bots/29cm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run sync
        env:
          CM29_ID: ${{ secrets.CM29_ID }}
          CM29_PW: ${{ secrets.CM29_PW }}
          CM29_TOTP_SECRET: ${{ secrets.CM29_TOTP_SECRET }}
          CM29_OTP_TO: ${{ secrets.CM29_OTP_TO }}
          # 2계정: 로하이스튜디오(mall_key 29cm-rohi). 비어 있으면 건너뜀
          CM29_ID_2: ${{ secrets.CM29_ID_2 }}
          CM29_PW_2: ${{ secrets.CM29_PW_2 }}
          CM29_TOTP_SECRET_2: ${{ secrets.CM29_TOTP_SECRET_2 }}
          CM29_OTP_TO_2: ${{ secrets.CM29_OTP_TO_2 }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CM29_DAYS: ${{ github.event_name == 'schedule' && '60' || '400' }}
      # 2차인증 화면 캡처·HTML 앞부분(이메일·6자리 이상 숫자 가림) — 실패했을 때만, 3일 보관(공개 저장소라 정상 run 은 안 올린다)
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: 29cm-2fa-debug
          path: channel-bots/29cm/debug/
          if-no-files-found: ignore
          retention-days: 3
