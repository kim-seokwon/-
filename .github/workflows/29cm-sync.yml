name: 29CM 주문 수집

on:
  schedule:
    - cron: '30 * * * *'   # 매시간 30분 (다른 채널과 분산)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: channel-bots/29cm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run sync
        env:
          CM29_ID: ${{ secrets.CM29_ID }}
          CM29_PW: ${{ secrets.CM29_PW }}
          CM29_TOTP_SECRET: ${{ secrets.CM29_TOTP_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
