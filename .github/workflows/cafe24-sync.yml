name: 카페24 주문 수집

on:
  # ⚠️ 스케줄 중지(2026-08-18): 카페24 수집은 Supabase pg_cron(job 3, */5분)이 x-cron-secret으로 담당.
  #   이 워크플로는 x-cron-secret 없이 호출해 매번 401 실패 → 실패알림 메일 폭탄. 중복이라 스케줄 끔.
  #   필요 시 수동 실행(workflow_dispatch)만 사용. 되살리려면 header에 x-cron-secret 추가 후 schedule 복구.
  workflow_dispatch:          # 수동 실행 버튼

concurrency:
  group: cafe24-order-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: cafe24-sync Edge Function 호출
        run: |
          echo "카페24 주문 수집 호출..."
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
            "$SUPABASE_URL/functions/v1/cafe24-sync" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "HTTP $code"
          cat /tmp/resp.json
          echo
          # 2xx 아니면 실패 처리
          [ "${code:0:1}" = "2" ] || { echo "::error::cafe24-sync 실패 (HTTP $code)"; exit 1; }
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
