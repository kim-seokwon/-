name: 키디키디 진단(송장API 캡처)

on:
  workflow_dispatch:   # 수동 실행 전용 — 로그인 후 배송/송장 API 엔드포인트 덤프

jobs:
  diag:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: channel-bots/kidikidi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run sync
        env:
          DIAG: '1'
          ELAND_ID: ${{ secrets.ELAND_ID }}
          ELAND_PW: ${{ secrets.ELAND_PW }}
          ELAND_TOTP_SECRET: ${{ secrets.ELAND_TOTP_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
